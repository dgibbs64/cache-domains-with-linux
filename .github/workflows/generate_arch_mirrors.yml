name: "Generate Arch Mirror List"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_arch_mirrors:
    runs-on: ubuntu-latest
    name: Generate Arch Mirror List

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Generate Arch Mirror List
        shell: bash
        run: |
          curl -fsSL --retry 3 https://archlinux.org/mirrorlist/all/http/ \
            | grep -oP 'https?://\K[^/:]+' \
            | LC_ALL=C sort -u >arch.txt.new
          count=$(wc -l <arch.txt.new)
          if [ "${count}" -lt 100 ]; then
            echo "::error::Only ${count} mirrors found, keeping the existing list"
            exit 1
          fi
          mv arch.txt.new arch.txt

      - name: Push to master branch
        run: |
          if git diff --quiet -- arch.txt; then
            echo "No mirror changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arch.txt
          git commit -m "GitHub Actions build: $(date +'%Y-%m-%d')"
          git push origin master
